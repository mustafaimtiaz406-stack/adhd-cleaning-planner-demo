<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F4A3A">
<meta name="color-scheme" content="light">
<title>ADHD Cleaning Planner — Free Demo</title>
<style>
:root{
  --forest:#2F4A3A; --forest-2:#3D5E4A; --forest-ink:#F6F2E8;
  --cream:#F7F3EA; --card:#FFFDF8; --sage:#E3EBDF; --sage-2:#CCDAC6;
  --ink:#1F2B24; --muted:#536158; --line:#DCD6C8;
  --accent:#9A5434; --accent-soft:#F4E6DB; --focus:#A85A35; --danger:#9B2F2F;
  --nav-h:64px; --safe-b:env(safe-area-inset-bottom, 0px); --safe-t:env(safe-area-inset-top, 0px);
  --font:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.5 var(--font);min-height:100vh;min-height:100dvh;overscroll-behavior-y:none;overflow-wrap:break-word;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:10px}
h1[tabindex="-1"]:focus{outline:none}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- layout ---------- */
.sidebar{display:none}
main{max-width:640px;margin:0 auto;padding:calc(12px + var(--safe-t)) 16px calc(var(--nav-h) + var(--safe-b) + 28px)}
body.has-minibar main{padding-bottom:calc(var(--nav-h) + var(--safe-b) + 96px)}
.screen > * + *{margin-top:16px}
.page-head{padding-top:8px}
.title{font-family:var(--serif);font-weight:600;font-size:1.75rem;line-height:1.2;margin:0;color:var(--forest);overflow-wrap:anywhere}
.lede{margin:6px 0 0;color:var(--muted)}
.eyebrow{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}
.h2{font-family:var(--serif);font-size:1.25rem;margin:0;color:var(--forest);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.9rem}
p{margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.card-sage{background:var(--sage);border-color:var(--sage-2)}
.stack > * + *{margin-top:10px}
.topbar{display:flex;align-items:center;gap:8px;margin:0 0 4px -8px}
.icon-btn{min-width:48px;min-height:48px;display:inline-grid;place-items:center;border:0;background:transparent;border-radius:12px;color:var(--forest)}
.ic{display:inline-grid;place-items:center;width:22px;height:22px;flex:none}
.ic svg{width:22px;height:22px}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-width:48px;min-height:52px;padding:12px 16px;border-radius:14px;border:1.5px solid transparent;font-weight:650;font-size:1rem;line-height:1.25;text-align:center;text-decoration:none}
.btn:disabled{opacity:.55;cursor:default}
.btn-primary{background:var(--forest);color:var(--forest-ink)}
.btn-primary:hover:not(:disabled){background:var(--forest-2)}
.btn-secondary{background:var(--sage);color:var(--forest);border-color:var(--sage-2)}
.btn-ghost{background:var(--card);color:var(--forest);border-color:var(--line)}
.btn-quiet{background:transparent;color:var(--forest);text-decoration:underline;text-underline-offset:3px;min-height:48px;font-weight:600}
.btn-danger{background:transparent;color:var(--danger);border-color:#E2C6C6}
.btn-danger-solid{background:var(--danger);color:#fff}
.btn-hero{min-height:96px;flex-direction:column;gap:4px;border-radius:20px;box-shadow:0 6px 18px rgba(47,74,58,.18)}
.hero-t{font-family:var(--serif);font-size:1.4rem;font-weight:600}
.hero-s{font-weight:500;font-size:.95rem;opacity:.92;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cta-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cta-row .btn{min-height:64px;flex-direction:column;gap:4px;padding:10px 8px}
.btn-row{display:grid;gap:10px}
.btn-row-2{grid-template-columns:1fr 1fr}

/* ---------- home ---------- */
.wins{display:flex;align-items:center;gap:8px;font-size:1.15rem;font-weight:650;color:var(--forest);margin-top:6px}
.nudge{display:flex;gap:12px;align-items:flex-start}
.nudge .ic{color:var(--accent);margin-top:2px}
.nudge > div{min-width:0;flex:1}
.nudge p{overflow-wrap:anywhere}
.hero-s,.mb-label,.title,.step,.wins span{overflow-wrap:anywhere}
.nudge-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.nudge-actions .btn{width:auto;min-width:48px;min-height:48px;padding:8px 14px;font-size:.95rem}

/* ---------- segmented controls ---------- */
.field-label{display:block;font-weight:650;margin:0 0 8px}
.seg{display:grid;gap:8px}
.seg-3{grid-template-columns:repeat(3,1fr)}
.seg-4{grid-template-columns:repeat(4,1fr)}
.seg-2{grid-template-columns:repeat(2,1fr)}
.seg button{position:relative;min-height:60px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 4px}
.seg button[aria-pressed="true"]{border-color:var(--forest);background:var(--sage);color:var(--forest)}
.seg button[aria-pressed="true"]::after{content:"✓";position:absolute;top:4px;right:8px;font-size:.8rem;font-weight:800}
.seg-sm button{min-height:48px}

/* ---------- recommendation ---------- */
.rec-card{padding:20px}
.rec-title{font-size:1.6rem;margin-top:6px}
.meta{display:flex;align-items:center;gap:6px;color:var(--muted);flex-wrap:wrap;margin-top:6px}
.first-step{margin-top:16px;background:var(--sage);border-radius:14px;padding:14px}
.step{font-size:1.15rem;font-weight:600;margin-top:4px;color:var(--ink);white-space:pre-wrap}

/* ---------- lists ---------- */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--sage);padding:4px;border-radius:14px}
.tabs button{min-height:48px;border:0;border-radius:10px;background:transparent;font-weight:600;color:var(--forest);font-size:.95rem}
.tabs button[aria-selected="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;min-width:0}
.row-main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:12px 14px;min-height:60px;display:flex;flex-direction:column;justify-content:center;gap:2px;border-radius:14px 0 0 14px}
.row-name{font-weight:650;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row-meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.88rem;flex-wrap:wrap}
.row-meta > span:not(.ic){flex:1 1 0;min-width:0}
.row-meta .ic,.meta .ic{width:18px;height:18px}
.row-status{font-size:.85rem;color:var(--forest);font-weight:600}
.row.is-done .row-name{color:var(--muted)}
.check{width:60px;flex:none;border:0;border-left:1px solid var(--line);background:none;display:grid;place-items:center;border-radius:0 14px 14px 0}
.ring{width:30px;height:30px;border-radius:50%;border:2px solid var(--forest);display:grid;place-items:center;color:#fff}
.ring .ic,.ring svg{width:18px;height:18px}
.check[aria-pressed="true"] .ring{background:var(--forest)}
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 8px}
.empty{text-align:center;padding:24px 16px;color:var(--muted)}
.empty .btn{margin-top:14px}
.link-list{list-style:none;padding:0;margin:0}
.link-item{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;text-align:left}
.link-item .ic{color:var(--forest)}
.link-item .li-t{font-weight:650;display:block}
.link-item .li-s{font-size:.88rem;color:var(--muted);display:block}
.li-body{flex:1;min-width:0}
.chev{color:var(--muted)}
.area-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.area-card{min-height:96px;text-align:left;padding:14px;border-radius:16px;border:1px solid var(--sage-2);background:var(--sage);display:flex;flex-direction:column;justify-content:space-between;gap:6px;min-width:0}
.area-card .a-name{font-family:var(--serif);font-size:1.1rem;font-weight:600;color:var(--forest);overflow-wrap:anywhere}
.area-card .a-meta{font-size:.88rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--sage);color:var(--forest);font-size:.88rem;font-weight:600}
.chip .ic{width:16px;height:16px}
.substeps{list-style:none;padding:0;margin:0}
.substep{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:6px;text-align:left}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--forest);flex:none;display:grid;place-items:center;color:#fff}
.substep[aria-checked="true"] .box{background:var(--forest)}
.substep[aria-checked="true"] .sub-t{color:var(--muted);text-decoration:line-through}
.sub-t{overflow-wrap:anywhere}
.notes{white-space:pre-wrap;overflow-wrap:anywhere}
.callout{background:var(--accent-soft);border-radius:14px;padding:14px;border:1px solid #E8CDBA}

/* ---------- forms ---------- */
.field{margin-top:18px}
.input,.select,.textarea{width:100%;min-height:52px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:16px}
.textarea{min-height:120px;resize:vertical;line-height:1.5}
.textarea-big{min-height:180px}
.input:focus,.select:focus,.textarea:focus{border-color:var(--forest);outline:3px solid rgba(47,74,58,.25);outline-offset:0}
.hint{font-size:.88rem;color:var(--muted);margin-top:6px}
.error{color:var(--danger);font-weight:600;font-size:.92rem;margin-top:6px}
.sub-editor{display:flex;gap:8px;margin-bottom:8px}
.sub-editor .input{flex:1;min-width:0}
.counter{font-size:.85rem;color:var(--muted);text-align:right;margin-top:4px}
.switch-row{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:left;margin-bottom:8px}
.switch{width:52px;height:30px;border-radius:999px;background:#C9C3B4;position:relative;flex:none;border:2px solid transparent}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.switch-row[aria-checked="true"] .switch{background:var(--forest)}
.switch-row[aria-checked="true"] .switch::after{left:24px}
.sw-state{font-size:.8rem;font-weight:700;color:var(--muted);margin-right:6px}

/* ---------- timer ---------- */
.timer-wrap{display:grid;place-items:center;margin:8px 0}
.timer-ring{width:min(240px,62vw);height:min(240px,62vw);position:relative}
.timer-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer-ring .track{stroke:var(--sage-2)}
.timer-ring .prog{stroke:var(--forest);transition:stroke-dashoffset .4s linear}
.timer-time{position:absolute;inset:0;display:grid;place-items:center;font-size:2.6rem;font-weight:650;font-variant-numeric:tabular-nums;color:var(--forest)}
.timer-state{text-align:center;color:var(--muted);font-weight:600;min-height:1.5em}
.queue-item{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:6px;text-align:left}
.queue-item[aria-checked="true"] .box{background:var(--forest)}
.queue-item[aria-checked="true"] .q-name{color:var(--muted);text-decoration:line-through}
.q-name{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.q-min{color:var(--muted);font-size:.9rem;flex:none}
.plan-list{list-style:none;padding:0;margin:0;counter-reset:q}
.plan-list li{display:flex;gap:12px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line)}
.plan-list li::before{counter-increment:q;content:counter(q) ".";font-weight:700;color:var(--forest);width:1.4em;flex:none}
.plan-list .p-name{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}

/* ---------- progress ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.stat-n{font-family:var(--serif);font-size:1.6rem;font-weight:600;color:var(--forest);display:block}
.stat-l{font-size:.82rem;color:var(--muted);display:block;line-height:1.25}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.day-dot{width:36px;height:36px;margin:4px auto 0;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--sage-2);font-weight:700;color:var(--forest)}
.day-dot.has{background:var(--sage);border:2px solid var(--forest)}
.day-l{font-size:.78rem;color:var(--muted)}
.day.is-today .day-l{color:var(--forest);font-weight:800}

/* ---------- brain dump ---------- */
.dump-item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.dump-text{white-space:pre-wrap;overflow-wrap:anywhere}
.dump-text.clamped{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.dump-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.dump-actions .btn{width:auto;min-width:48px;min-height:48px;padding:8px 12px;font-size:.92rem}
.done-tag{display:inline-flex;align-items:center;gap:6px;color:var(--forest);font-weight:650;font-size:.92rem;min-height:44px}

/* ---------- celebration / calm screens ---------- */
.calm{text-align:center;padding-top:10vh}
.calm .title{font-size:2rem}
.calm .heart{font-size:2.4rem;color:var(--accent);display:block;margin-bottom:8px}

/* ---------- fixed chrome ---------- */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--forest);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:var(--safe-b);box-shadow:0 -2px 12px rgba(0,0,0,.08)}
.bottomnav a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:var(--nav-h);color:#D3DED3;text-decoration:none;font-size:.8rem;font-weight:600}
.bottomnav a[aria-current="page"]{color:#fff}
.bottomnav a[aria-current="page"]::before{content:"";position:absolute;top:6px;width:36px;height:3px;border-radius:3px;background:#F2D8C6}
.minibar{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + var(--safe-b) + 8px);z-index:29;max-width:616px;margin:0 auto}
.minibar button{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:8px 16px;border-radius:16px;border:1px solid var(--sage-2);background:var(--card);box-shadow:0 6px 18px rgba(31,43,36,.16);text-align:left;color:var(--forest);font-weight:650}
.mb-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb-time{font-variant-numeric:tabular-nums;flex:none}
.toast{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + var(--safe-b) + 12px);z-index:40;max-width:600px;margin:0 auto;background:var(--ink);color:#fff;border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
body.has-minibar .toast{bottom:calc(var(--nav-h) + var(--safe-b) + 76px)}
.toast-msg{flex:1;min-width:0}
.toast-btn{min-height:48px;min-width:64px;padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;font-weight:700}
.banner{position:sticky;top:0;z-index:35;background:#FBEAD9;color:#5A2A12;border-bottom:1px solid #E8C4A5;padding:calc(10px + var(--safe-t)) 16px 10px;font-size:.95rem;display:flex;gap:10px;align-items:flex-start}
.banner p{flex:1}
.banner .icon-btn{min-width:48px;min-height:48px;color:#5A2A12}
.sheet-root{position:fixed;inset:0;z-index:50}
.backdrop{position:absolute;inset:0;background:rgba(20,28,23,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;max-height:88dvh;overflow:auto;background:var(--cream);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + var(--safe-b));max-width:640px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.sheet .h2{margin-bottom:8px}
.sheet .btn-row{margin-top:18px}
body.sheet-open{overflow:hidden}
body.typing .bottomnav,body.typing .minibar{display:none}
body.typing main{padding-bottom:32px}
body.typing .toast{bottom:16px}

/* ---------- desktop ---------- */
@media (min-width:900px){
  :root{--nav-h:0px}
  .bottomnav{display:none}
  .sidebar{display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;width:248px;background:var(--forest);color:var(--forest-ink);padding:24px 14px;overflow:auto}
  .brand{font-family:var(--serif);font-size:1.2rem;font-weight:600;padding:0 10px 18px;line-height:1.3}
  .brand small{display:block;font-family:var(--font);font-size:.8rem;opacity:.8;font-weight:500}
  .side-link{display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 12px;border-radius:12px;color:#D3DED3;text-decoration:none;font-weight:600}
  .side-link[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff}
  .side-link:hover{background:rgba(255,255,255,.08)}
  .side-sep{height:1px;background:rgba(255,255,255,.16);margin:10px 8px}
  main{margin-left:248px;padding:32px 40px 120px;max-width:none}
  main > .screen{max-width:640px;margin:0 auto}
  body.has-minibar main{padding-bottom:140px}
  .minibar{left:calc(248px + 40px);right:40px;bottom:20px}
  .toast{left:calc(248px + 40px);right:40px;bottom:20px}
  body.has-minibar .toast{bottom:88px}
  .sheet{bottom:auto;top:50%;transform:translateY(-50%);border-radius:20px;left:248px}
  .area-grid{grid-template-columns:repeat(3,1fr)}
}
/* ---------- FREE DEMO ---------- */
.demobar{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px 10px;padding:calc(8px + var(--safe-t)) 16px 8px;background:var(--sage);border-bottom:1px solid var(--sage-2);color:var(--forest);font-size:.86rem;font-weight:600;text-align:center;line-height:1.35}
.demo-pill{display:inline-block;background:var(--forest);color:var(--forest-ink);font-weight:800;letter-spacing:.08em;font-size:.72rem;padding:4px 10px;border-radius:999px;white-space:nowrap}
@media (max-width:899px){.demobar + main{padding-top:12px}}
@media (min-width:900px){.demobar{margin-left:248px}}
.side-pill{display:block;width:max-content;margin:8px 0 4px;background:#F2D8C6;color:var(--forest)}
.demo-card{border-color:var(--sage-2)}
.demo-card .btn{margin-top:10px}
.demo-slots{font-weight:650;color:var(--forest);margin-top:8px}
.demo-off{opacity:.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="banner" class="banner" role="alert" hidden></div>
<aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
<div id="demobar" class="demobar" role="note"></div>
<main id="main" tabindex="-1"></main>
<div id="minibar" class="minibar" hidden></div>
<nav id="bottomnav" class="bottomnav" aria-label="Main navigation"></nav>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="sheet-root" class="sheet-root" hidden></div>
<noscript><p style="padding:20px">This planner needs JavaScript to run. Please open it in a normal browser window (Chrome, Safari, Edge or Firefox).</p></noscript>

<script>
(function () {
'use strict';

/* =====================================================================
   FREE DEMO CONFIGURATION
   Paste the full Etsy listing URL of the PAID planner between the quotes,
   It looks like:  https://www.etsy.com/listing/<listing number>/<listing name>
   Until a real Etsy listing URL is pasted, the "Get the Full Planner"
   buttons do not open any link (no fake or placeholder link is used).
   ===================================================================== */
const ETSY_LISTING_URL = "PASTE_ETSY_LISTING_URL_HERE";
const DEMO = true;
const DEMO_LIMIT = 5;   // total customer-created task entries allowed in the demo (never refunded)

/* =====================================================================
   1. CONSTANTS
   ===================================================================== */
const APP_ID = 'adhdCleaningPlannerDemo';   // FREE DEMO: separate storage namespace from the paid planner
const APP_VERSION = '1.2.2';

/* =====================================================================
   3. DATE LOGIC  — local calendar dates as 'YYYY-MM-DD' strings.
   All arithmetic converts to whole UTC day numbers, so it is DST-safe and
   never shifts a date because of the device's UTC offset.
   ===================================================================== */
const pad = (n) => String(n).padStart(2, '0');
const D = {
  today() { const d = new Date(); return D.make(d.getFullYear(), d.getMonth() + 1, d.getDate()); },
  keyOf(ts) { const d = new Date(ts); return D.make(d.getFullYear(), d.getMonth() + 1, d.getDate()); },
  make(y, m, d) { return String(y).padStart(4, '0') + '-' + pad(m) + '-' + pad(d); },
  parts(k) { return { y: +k.slice(0, 4), m: +k.slice(5, 7), d: +k.slice(8, 10) }; },
  dim(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }, // m = 1..12
  valid(k) {
    if (typeof k !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(k)) return false;
    const p = D.parts(k);
    return p.y >= 1970 && p.y <= 9999 && p.m >= 1 && p.m <= 12 && p.d >= 1 && p.d <= D.dim(p.y, p.m);
  },
  num(k) { const p = D.parts(k); return Math.round(Date.UTC(p.y, p.m - 1, p.d) / 864e5); },
  fromNum(n) { const dt = new Date(n * 864e5); return D.make(dt.getUTCFullYear(), dt.getUTCMonth() + 1, dt.getUTCDate()); },
  add(k, n) { return D.fromNum(D.num(k) + n); },
  diff(a, b) { return D.num(a) - D.num(b); }, // a − b in days
  weekStart(k) { const dow = (new Date(D.num(k) * 864e5).getUTCDay() + 6) % 7; return D.add(k, -dow); }, // Monday
  // First date on/after k whose day-of-month is `day`, clamped to the month length (31 → 30/29/28).
  monthlyOnOrAfter(k, day) {
    const p = D.parts(k); let y = p.y, m = p.m, d = Math.min(day, D.dim(y, m));
    if (d < p.d) { m++; if (m > 12) { m = 1; y++; } d = Math.min(day, D.dim(y, m)); }
    return D.make(y, m, d);
  },
  fmt(k, opts) { try { return new Intl.DateTimeFormat(undefined, Object.assign({ timeZone: 'UTC' }, opts)).format(new Date(D.num(k) * 864e5)); } catch (e) { return k; } },
  label(k) {
    const df = D.diff(k, D.today());
    if (df === 0) return S.today; if (df === 1) return S.tomorrow; if (df === -1) return S.yesterday;
    return D.fmt(k, { weekday: 'short', day: 'numeric', month: 'short' });
  },
  weekday(k) { return D.fmt(k, { weekday: 'short' }); }
};

/* =====================================================================
   4. DOM UTILITIES — user text is ONLY ever inserted as text nodes.
   innerHTML is used solely for the static icon SVG constants below.
   ===================================================================== */
const $ = (sel, root) => (root || document).querySelector(sel);
function h(tag, attrs) {
  const el = document.createElement(tag);
  let props = null;
  if (attrs) {
    for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'fk') el.setAttribute('data-fk', v);
      else if (k === 'props') props = v;
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (v === true) el.setAttribute(k, '');
      else el.setAttribute(k, String(v));
    }
  }
  appendKids(el, Array.prototype.slice.call(arguments, 2));
  if (props) Object.assign(el, props);
  return el;
}
function appendKids(el, kids) {
  for (const c of kids) {
    if (c == null || c === false) continue;
    if (Array.isArray(c)) { appendKids(el, c); continue; }
    el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  }
}

  for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.indexOf(KEY_DAMAGED_PREFIX) === 0) keys.push(k); }
  keys.sort().slice(0, Math.max(0, keys.length - 1)).forEach((k) => localStorage.removeItem(k));
  localStorage.setItem(KEY_DAMAGED_PREFIX + Date.now(), raw);
}

/* =====================================================================
   15. NAVIGATION & RENDERING
   ===================================================================== */
const ROUTES = [
  [/^home$/, screenHome], [/^help$/, screenHelp], [/^help\/result$/, screenRecResult],
  [/^quick$/, screenQuick], [/^quick\/plan$/, screenQuickPlan],
  [/^overwhelm$/, screenOverwhelm], [/^tiny$/, screenTiny], [/^minimum$/, screenMinimum], [/^enough$/, screenEnough], [/^done$/, screenDone],
  [/^tasks$/, screenTasks], [/^task\/new$/, () => screenTaskForm(null)], [/^task\/([\w-]+)\/edit$/, (id) => screenTaskForm(id)], [/^task\/([\w-]+)$/, screenTask],
  [/^areas$/, screenAreas], [/^area\/([\w-]+)$/, screenArea],
  [/^more$/, screenMore], [/^schedule$/, screenSchedule], [/^timer$/, screenTimer], [/^progress$/, screenProgress],
  [/^dump$/, screenDump], [/^reminders$/, screenReminders], [/^settings$/, screenSettings]
];
const NAV = [['home', 'home', S.nav.home], ['tasks', 'tasks', S.nav.tasks], ['areas', 'areas', S.nav.areas], ['more', 'more', S.nav.more]];
function parseHash() {
  const raw = location.hash.replace(/^#\/?/, '');
  const qi = raw.indexOf('?');
  const path = (qi >= 0 ? raw.slice(0, qi) : raw) || 'home';
  return { path, q: new URLSearchParams(qi >= 0 ? raw.slice(qi + 1) : '') };
}
function go(path) { const target = '#/' + path; if (location.hash === target) render(); else location.hash = target; }
// history.replaceState throws in some sandboxed/embedded viewers (e.g. about:srcdoc previews).
// Fall back to a normal hash change there, which still routes correctly.
function replaceHash(target) { try { history.replaceState(null, '', target); return true; } catch (e) { return false; } }
function replaceRoute(path) { const target = '#/' + path; if (location.hash === target) { render(); return; } if (replaceHash(target)) render(); else location.hash = target; }
function navGroup(path) {
  const top = path.split('/')[0];
  if (top === 'tasks' || top === 'task') return 'tasks';
  if (top === 'areas' || top === 'area') return 'areas';
  if (['home', 'help', 'quick', 'overwhelm', 'tiny', 'minimum', 'enough', 'done'].indexOf(top) >= 0) return 'home';
  return 'more';
}
function drawNav(path) {
  const g = navGroup(path), top = path.split('/')[0];
  const bn = $('#bottomnav');
  bn.replaceChildren.apply(bn, NAV.map(([id, ic, label]) => h('a', { href: '#/' + id, 'aria-current': g === id ? 'page' : null }, icon(ic), h('span', {}, label))));
  const side = $('#sidebar');
  const sideItems = NAV.slice(0, 3).map(([id, ic, label]) => h('a', { class: 'side-link', href: '#/' + id, 'aria-current': g === id ? 'page' : null }, icon(ic), label));
  const moreItems = [['schedule', 'calendar'], ['timer', 'timer'], ['progress', 'chart'], ['dump', 'note'], ['reminders', 'bell'], ['settings', 'gear']]
    .map(([id, ic]) => h('a', { class: 'side-link', href: '#/' + id, 'aria-current': top === id ? 'page' : null }, icon(ic), S.more[id][0]));
  side.replaceChildren(h('div', { class: 'brand' }, S.appName, h('span', { class: 'demo-pill side-pill' }, S.demoBadge), h('small', {}, S.welcomeSub)), h('nav', { 'aria-label': 'Main' }, sideItems, h('div', { class: 'side-sep' }), moreItems));
  const hideNav = !!recoveryMode || (state && !state.settings.onboarded);
  bn.hidden = hideNav; side.hidden = hideNav;
}
function drawMinibar(path) {
  const mb = $('#minibar'), ts = state && state.timerState;
  const show = !!ts && path !== 'timer' && !recoveryMode;
  document.body.classList.toggle('has-minibar', show);
  if (!show) { mb.hidden = true; mb.replaceChildren(); return; }
  mb.replaceChildren(h('button', { type: 'button', 'aria-label': S.returnTimer + ': ' + ts.label, onClick: () => go('timer') }, icon('timer'),
    h('span', { class: 'mb-label' }, ts.label), h('span', { class: 'mb-time', 'data-timer-time': '' }, Timer.displayText(ts))));
  mb.hidden = false;
}
let lastDay = null;
function checkDay() {
  const t = D.today();
  const changed = !!lastDay && lastDay !== t;
  if (changed) { cleanSessionState(); ui.quickPlan = null; }
  lastDay = t;
  return changed;
}
function render() {
  if (!state && !recoveryMode) return;
  const { path, q } = parseHash();
  ui.q = q;
  const main = $('#main');
  const active = document.activeElement;
  const fk = active && main.contains(active) ? active.getAttribute('data-fk') : null;
  const samePath = ui.lastPath === path;
  let node;
  try {
    if (recoveryMode) node = screenRecovery();
    else {
      checkDay();
      if (state.timerState) Timer.checkEnd();
      let fn = null, params = [];
      for (const [re, f] of ROUTES) { const m = path.match(re); if (m) { fn = f; params = m.slice(1); break; } }
      if (!state.settings.onboarded) fn = screenWelcome;
      node = fn ? fn.apply(null, params) : h('div', { class: 'screen' }, h('p', { class: 'empty' }, S.notFound), h('button', { class: 'btn btn-secondary', type: 'button', onClick: () => go('home') }, S.backHome));
    }
  } catch (e) {
    handleError(e);
    node = h('div', { class: 'screen' }, h('p', { class: 'empty' }, S.genericError), h('button', { class: 'btn btn-secondary', type: 'button', onClick: () => go('home') }, S.backHome));
  }
  main.replaceChildren(node);
  // A focused input removed by re-render fires no blur on some browsers (e.g. iOS Safari): clear typing mode.
  const ae = document.activeElement;
  if (!ae || !ae.matches || !ae.matches(TYPING_SEL) || !document.body.contains(ae)) document.body.classList.remove('typing');
  drawNav(path);
  drawMinibar(path);
  syncTicker();
  if (!samePath) {
    window.scrollTo(0, 0);
    const hd = main.querySelector('h1');
    if (hd && ui.lastPath !== undefined) { hd.setAttribute('tabindex', '-1'); try { hd.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
    ui.lastPath = path;
  } else if (fk) {
    const el = main.querySelector('[data-fk="' + fk.replace(/["\\]/g, '') + '"]');
    if (el) try { el.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
  }
}
function handleError(err) {
  // Intentional, documented: handled errors are logged as warnings, never thrown to the console as errors.
  try { console.warn('[ADHD Cleaning Planner] handled error:', err && err.message ? err.message : err); } catch (e) { /* ignore */ }
  try { toast(S.genericError); } catch (e) { /* ignore */ }
}
window.addEventListener('error', (e) => { e.preventDefault(); handleError(e.error || e.message); });
window.addEventListener('unhandledrejection', (e) => { e.preventDefault(); handleError(e.reason); });
window.addEventListener('hashchange', () => { if (closeCurrentSheet) closeCurrentSheet(null); render(); });
// Routes holding unsaved typing: never re-render them just because the window regained focus.
function isFormRoute() { const p = parseHash().path; return p === 'task/new' || /\/edit$/.test(p); }
function onReturn() {
  if (!state || recoveryMode) return;
  if (document.visibilityState === 'hidden') return;
  const dayChanged = checkDay();
  const ended = state.timerState ? Timer.checkEnd() : false;
  if (dayChanged || ended || !isFormRoute()) render(); else updateTimeDisplays();
}
document.addEventListener('visibilitychange', onReturn);
window.addEventListener('focus', onReturn);
window.addEventListener('pageshow', (e) => { if (e.persisted) onReturn(); });
// Hide the bottom navigation and timer bar while typing so the keyboard never covers inputs.
const TYPING_SEL = 'input:not([type=checkbox]):not([type=file]):not([type=radio]),textarea,select';
document.addEventListener('focusin', (e) => { if (e.target.matches && e.target.matches(TYPING_SEL) && window.innerWidth < 900) document.body.classList.add('typing'); });
document.addEventListener('focusout', () => setTimeout(() => { const a = document.activeElement; if (!a || !a.matches || !a.matches(TYPING_SEL)) document.body.classList.remove('typing'); }, 60));

/* =====================================================================
   16. BOOT — never silently resets stored data.
   ===================================================================== */
function boot() {
  $('#demobar').replaceChildren(h('span', { class: 'demo-pill' }, S.demoBadge), h('span', {}, S.demoTagline));
  if (!storageAvailable()) {
    storageOk = false;
    state = freshState();
    showBanner('storage', S.storageUnavailable);
  } else {
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
    if (raw == null) {
      state = freshState();
      persist();
    } else {
      let obj = null, parsed = true;
      try { obj = JSON.parse(raw); } catch (e) { parsed = false; }
      const res = parsed ? validateData(obj) : { ok: false };
      if (!res.ok) {
        recoveryMode = { raw };
      } else {
        state = res.data;
        let changed = false;
        if (res.skipped > 0) { try { stashDamaged(raw); } catch (e) { /* ignore */ } changed = true; setTimeout(() => toast(S.damagedSetAside(res.skipped)), 300); }
        if (res.repaired > 0) changed = true; // persist repairs (e.g. tasks of a vanished area → Unsorted)
        if (reconcileStarters(state)) changed = true;
        cleanSessionState();
        if (changed) persist();
      }
    }
  }
  if (!location.hash) replaceHash('#/home'); // if not allowed, the router already defaults to Home
  render();
}
boot();
})();
</script>
